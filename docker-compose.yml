# Site-Selection App — docker compose skeleton (GEO-1)
#
# Five services share one read-only data artifact via the named volume `data:`.
#   - ingest   : one-shot offline pipeline (Service A). Writes data: (rw).
#   - tiles    : one-shot tippecanoe step — parcels.geojson → parcels.pmtiles. Writes data: (rw).
#   - api      : FastAPI scoring engine + agent. Reads data: (ro).
#   - web      : nginx — serves the SPA, proxies /api, serves *.pmtiles. Reads data: (ro).
#   - frontend : build-only. Compiles the SPA into web_dist:.
#
# `ingest`, `tiles`, and `frontend` use compose profiles so they do NOT start on `up`; run them
# explicitly as one-shot jobs (FR-A5: ingest never runs on the request path). Build the data
# artifact + tiles + SPA first, then bring the long-running services up:
#   docker compose run --rm ingest      # build /data/current/site.duckdb (+ enriched parcels)
#   docker compose run --rm tiles       # build /data/current/parcels.pmtiles (GEO-14)
#   docker compose run --rm frontend    # compile the SPA into web_dist:
#   docker compose up -d api web         # api waits for the artifact; web waits for api healthy
#
# Hardening (GEO-35): restart policy + mem/cpu limits on the long-running api/web (NOT the
# one-shot ingest/frontend), DUCKDB_THREADS pinned to the cpu limit, and web gated on the api
# becoming healthy. Healthchecks live in the Dockerfiles (GEO-33) and are inherited here. nginx
# + proxy is GEO-34. The :ro mounts encode the read-only-artifact contract (§1).

name: geo-energy

services:
  ingest:
    build:
      context: ./ingest
    image: geo-energy/ingest
    profiles: ["ingest"]          # one-shot only — `docker compose run --rm ingest`
    env_file:
      - path: .env                # optional: falls back to environment: defaults if absent
        required: false
    environment:
      DATA_DIR: /data
      # Cap DuckDB's buffer pool so the large enrichment (421k parcels × per-parcel nearest
      # substation / transmission line / GHI joins) SPILLS to disk instead of OOM-killing the
      # container (exit 137 = SIGKILL). DuckDB sizes its pool to ~80% of host RAM and does NOT
      # reliably read the cgroup limit, so without this it grabs more than the container allows.
      # Keep this BELOW Docker Desktop's VM memory (Settings → Resources → Memory; give it
      # ≥ ~6 GB for headroom + speed). Override per-run with DUCKDB_MEMORY_LIMIT in .env.
      DUCKDB_MEMORY_LIMIT: ${DUCKDB_MEMORY_LIMIT:-3GB}
    volumes:
      - data:/data                # read-write: writes the artifact into /data/current

  tiles:
    build:
      context: ./ingest           # reuse the ingest image — it now bundles the tippecanoe binary
    image: geo-energy/ingest
    profiles: ["tiles"]           # one-shot only — `docker compose run --rm tiles` (after ingest)
    env_file:
      - path: .env                # optional: LOG_LEVEL / GEO_TIPPECANOE_BIN overrides if present
        required: false
    environment:
      DATA_DIR: /data
    # Override the image ENTRYPOINT (`python -m pipeline`): run ONLY the GEO-14 tiling step, which
    # reads /data/current/parcels.geojson and writes /data/current/parcels.pmtiles (config-driven
    # zoom/attrs from pipeline/config.py). Independent of the DuckDB build — safe to run any time
    # after `ingest`. Runs as the image's non-root user (uid 10001, owns /data).
    entrypoint: ["python", "-m", "pipeline.tiles"]
    volumes:
      - data:/data                # read-write: writes parcels.pmtiles into /data/current

  api:
    build:
      context: ./api
    image: geo-energy/api
    env_file:
      - path: .env                # optional: falls back to environment: defaults if absent
        required: false
    environment:
      DATA_DIR: /data
      # GEO-35: pin DuckDB threads to the cpus limit below. os.cpu_count() does NOT respect the
      # cgroup cpu quota, so without this the API would size PRAGMA threads to the HOST core
      # count and oversubscribe the container's allotted CPUs.
      DUCKDB_THREADS: "2"
      # Pin the buffer pool below mem_limit (DuckDB defaults to ~80% of HOST RAM and would
      # otherwise OOM-kill the capped container under load).
      DUCKDB_MEMORY_LIMIT: "768MB"
      # Writable spill dir under HOME — the default temp dir is next to the DB on the :ro mount.
      DUCKDB_TEMP_DIR: /home/api/.duckdb_tmp
      # GEO-21 agent (Pydantic AI). The real values come from `.env` (env_file above); these
      # explicit passthroughs document the contract and supply safe non-secret defaults via
      # ${VAR:-default}. NEVER inline a real key here — secrets stay in .env / CI secrets only.
      #   GOOGLE_API_KEY    : Gemini Developer API key (SECRET; blank default → agent disabled).
      #   ANTHROPIC_API_KEY : kept for a one-flip provider switch-back (SECRET; blank default).
      #   AGENT_MODEL       : provider:model string Pydantic AI resolves (default Gemini Flash).
      # The AGENT_* limit knobs are the API's safety caps; the API owns their exact defaults
      # (the values here are best-effort placeholders kept in sync with nginx /api/agent limits).
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-google:gemini-3.5-flash}
      # GEO-40 voice mode (OpenAI Realtime). OPENAI_API_KEY mints short-lived browser session
      # secrets server-side (SECRET; blank default → voice mode shows a disabled state). Model/voice
      # are tunable without code changes.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime}
      OPENAI_REALTIME_VOICE: ${OPENAI_REALTIME_VOICE:-marin}
      AGENT_TIMEOUT_S: ${AGENT_TIMEOUT_S:-60}
      AGENT_MAX_MESSAGE_CHARS: ${AGENT_MAX_MESSAGE_CHARS:-4000}
      AGENT_MAX_CONCURRENCY: ${AGENT_MAX_CONCURRENCY:-4}
    volumes:
      - data:/data:ro             # read-only artifact (GEO-15 opens DuckDB read_only=True)
    expose:
      - "8000"                    # internal; web proxies to it. Uncomment ports for direct dev:
    # ports:
    #   - "8000:8000"
    restart: unless-stopped       # GEO-35: long-running service (NOT the one-shot ingest/frontend)
    mem_limit: 1g                 # GEO-35: VPS sizing — DuckDB + spatial + scoring working set
    cpus: 2                       # GEO-35: must match DUCKDB_THREADS above
    # GEO-37: bound on-disk log growth (json-file driver, rotated). Without this the default
    # json-file logs are unbounded and can fill a small VPS disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Readiness comes from the image's HEALTHCHECK (api/Dockerfile -> GET /api/health); compose
    # uses it for `web`'s depends_on: service_healthy. NB: /api/health is 200 only once the
    # artifact exists, so run `docker compose run --rm ingest` before `up` on a fresh stack.

  frontend:
    build:
      context: ./frontend
      # Build-time Vite env injection (baked into the client bundle; VITE_* are public by
      # design — real secrets never reach the frontend). MAPBOX_TOKEN defaults to empty
      # (token-less CARTO basemap) when unset in .env.
      args:
        VITE_API_BASE_URL: /api
        VITE_MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
        VITE_PARCELS_PMTILES_URL: /data/current/parcels.pmtiles
    image: geo-energy/frontend
    profiles: ["build"]           # build-only — `docker compose run --rm frontend`
    volumes:
      - web_dist:/out             # emits the compiled SPA (dist/) for web to serve

  web:
    build:
      context: ./web
    image: geo-energy/web
    ports:
      - "8080:8080"               # nginx runs unprivileged (non-root) and listens on 8080
    volumes:
      - web_dist:/usr/share/nginx/html:ro   # SPA built by `frontend`
      - data:/data:ro                       # serve *.pmtiles via byte-range (GEO-34)
    depends_on:
      api:
        condition: service_healthy  # GEO-35: wait for the API (and thus the artifact) to be ready
    restart: unless-stopped         # GEO-35
    mem_limit: 256m                 # GEO-35: nginx is light
    cpus: 1                         # GEO-35
    # GEO-37: rotate the access/error logs (latency `log_format timed` in web/nginx.conf).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:                           # the read-only artifact (ingest rw; api/web ro)
  web_dist:                       # compiled SPA (frontend → web)
