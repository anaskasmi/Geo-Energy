# GEO-36 — SSH daemon hardening drop-in. Install as a drop-in so it overrides the distro
# default without editing /etc/ssh/sshd_config in place:
#
#   sudo install -m 0644 deploy/sshd_hardening.conf /etc/ssh/sshd_config.d/10-geo-hardening.conf
#   sudo sshd -t && sudo systemctl reload ssh   # validate THEN reload (keep your session open!)
#
# NB: confirm you have a working key-based login in a SECOND session before reloading — these
# settings disable password login and you can lock yourself out otherwise.

# No passwords — keys only. Defeats credential-stuffing/brute-force against SSH entirely.
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes

# Root may connect ONLY with a key (never a password), and ideally not at all — prefer a
# sudo-capable user. `prohibit-password` is the safe default for automation/break-glass.
PermitRootLogin prohibit-password

# Reduce attack surface / tighten the auth window.
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no

# Drop idle sessions (300s × 2 = 10 min) so abandoned shells don't linger.
ClientAliveInterval 300
ClientAliveCountMax 2
