<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale: pinch-zoom must stay available (WCAG 1.4.4 Resize Text / 1.4.10 Reflow).
         viewport-fit=cover lets the app paint into the notch/safe-area insets it reads via env(). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Tint the mobile browser UI to the app background per theme (matches --bg in global.css). -->
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <title>Site-Selection App</title>
    <script>
      // Apply the persisted / system theme before first paint to avoid a flash of the
      // wrong theme. Mirrors the logic in src/theme/ThemeProvider.tsx.
      (function () {
        try {
          var stored = localStorage.getItem("geo-energy-theme");
          var pref = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = pref === "system" ? (systemDark ? "dark" : "light") : pref;
          document.documentElement.setAttribute("data-theme", resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
