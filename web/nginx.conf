# Web (nginx) server config (GEO-34). Serves the SPA, reverse-proxies /api, and serves the
# parcels *.pmtiles archive with HTTP byte-range so MapLibre's pmtiles protocol can fetch it
# with range requests. Runs under the unprivileged nginx image (non-root) on :8080 (GEO-33).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;   # SPA built by the `frontend` service (web_dist volume)
    index index.html;

    # gzip for text assets. pmtiles / images are NOT gzipped (already compressed, and pmtiles
    # is byte-range served — compression would break ranges). brotli is omitted: the stock
    # nginx image ships no brotli module; adding it needs a custom nginx build (deferred).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript text/javascript application/json
        text/css image/svg+xml application/wasm text/plain;

    # Container liveness (independent of whether the SPA/artifact exist yet) — for HEALTHCHECK.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets are content-addressed → cache hard. index.html must NOT be cached so
    # a redeploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Parcels vector tiles: byte-range + permissive CORS + immutable cache. ONLY *.pmtiles is
    # exposed from /data — the regex location is matched before the /data/ deny below. Range
    # serving is on by default for static files; the headers make it explicit + CORS-friendly
    # in case tiles are ever fronted by a CDN / different origin.
    location ~* ^/data/.+\.pmtiles$ {
        root /;                        # /data/current/x.pmtiles → /data/current/x.pmtiles
        default_type application/octet-stream;
        add_header Accept-Ranges bytes always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges, ETag" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Everything else under /data/ is private (the DuckDB artifact, parquet, slope.tif, the
    # release manifest, …). Never serve it.
    location /data/ {
        return 404;
    }

    # API reverse proxy. Resolve the `api` service name via Docker's embedded DNS at REQUEST
    # time (a variable proxy_pass + resolver) rather than at config load — so `nginx -t` and
    # startup don't fail when `api` isn't resolvable yet, and a restarted api is picked up.
    # With a variable proxy_pass nginx does NOT auto-append the matched path, so pass the full
    # original URI explicitly. The FastAPI app serves routes UNDER /api (e.g. /api/health), so
    # $request_uri (unchanged) is exactly right — a trailing-slash proxy_pass would strip /api.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SPA history fallback — client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
