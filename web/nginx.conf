# PLACEHOLDER nginx config (GEO-1).
# Real config — SPA history fallback to index.html, /api proxy_pass to http://api:8000/
# (timeouts + real-IP), *.pmtiles with CORS + Range + immutable cache, gzip/brotli — is
# GEO-34. This stub serves the built SPA and proxies /api so the skeleton is coherent.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;   # SPA built by the `frontend` service (web_dist volume)
    index index.html;

    # SPA history fallback (refined in GEO-34).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy (timeouts, real-IP forwarding, etc. → GEO-34).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # NOTE: *.pmtiles serving (byte-range + CORS + immutable cache) is intentionally
    # NOT implemented here — that is GEO-34. The data:/data:ro mount stays (it is the
    # §1 read-only-artifact contract), but this stub only serves the SPA and proxies /api.
}
