# Web (nginx) server config (GEO-34). Serves the SPA, reverse-proxies /api, and serves the
# parcels *.pmtiles archive with HTTP byte-range so MapLibre's pmtiles protocol can fetch it
# with range requests. Runs under the unprivileged nginx image (non-root) on :8080 (GEO-33).
#
# GEO-37 (runtime protection + observability) and GEO-36 (security headers) layer on top:
#   - http-context blocks below (rate-limit / conn zones, a latency log_format, real-IP) sit
#     BEFORE the `server {}` block. This file is copied to /etc/nginx/conf.d/default.conf,
#     which the stock image `include`s INSIDE `http {}` — so directives placed here, outside
#     the server block, are in http context (the only context `limit_req_zone`/`log_format`
#     accept). Verified with `nginx -t` (web/Dockerfile validate stage).
#   - per-IP rate + connection limits on /api (sane) and /api/agent (stricter — that path
#     spends the paid LLM key), a payload cap, and app security headers (CSP for MapLibre +
#     deck.gl, nosniff, Referrer-Policy, frame-ancestors). HSTS is NOT set here: this listener
#     is plain HTTP on :8080 behind a TLS-terminating edge (GEO-36 / docker-compose.tls.yml),
#     and HSTS belongs only where TLS actually terminates.

# ── http context (GEO-37) ──────────────────────────────────────────────────────
# Per-IP rate-limit zones (keyed on the client address). 10m holds ~160k IPs.
#   api_rl   : the general /api surface — interactive scoring, explain, context.
#   agent_rl : the SSE agent (/api/agent) — much tighter; it drives the metered LLM key.
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=agent_rl:10m rate=1r/s;
# Concurrent-connection zones — cap simultaneous in-flight requests per IP. The agent zone is
# separate so a few long-lived SSE streams can't be opened en masse from one client.
limit_conn_zone $binary_remote_addr zone=api_conns:10m;
limit_conn_zone $binary_remote_addr zone=agent_conns:10m;

# Latency-visible access log: status + total + upstream time + method + uri (GEO-37 obs).
# Named `timed` (the base image already defines `main`, so reusing that name would clash).
log_format timed '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent rt=$request_time urt=$upstream_response_time '
                 'method=$request_method uri=$uri "$http_referer" "$http_user_agent"';

# Real client IP when a reverse-proxy/CDN terminates TLS in front (docker-compose.tls.yml or a
# CDN). Trust ONLY private RFC1918 sources — the compose network the edge sits on — so a
# direct, internet-facing client cannot spoof X-Forwarded-For to dodge the per-IP limits above.
# In production `web` is never published directly; only the edge reaches it (GEO-36/37). If you
# DO expose :8080 directly, these are inert (no private-range hop sets a forwarded address).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;   # SPA built by the `frontend` service (web_dist volume)
    index index.html;

    access_log /var/log/nginx/access.log timed;

    # Return 429 (not the default 503) when a rate/conn limit trips — clearer to clients/CDNs.
    limit_req_status 429;
    limit_conn_status 429;

    # gzip for text assets. pmtiles / images are NOT gzipped (already compressed, and pmtiles
    # is byte-range served — compression would break ranges). brotli is omitted: the stock
    # nginx image ships no brotli module; adding it needs a custom nginx build (deferred).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript text/javascript application/json
        text/css image/svg+xml application/wasm text/plain;

    # ── Security headers (GEO-36) ────────────────────────────────────────────────
    # Applied at server level so they're inherited by locations that set NO add_header of
    # their own (`/`, `/api/`, `/api/agent`). nginx's add_header is REPLACE-not-merge: any
    # location with its own add_header loses these, so the document/asset locations below
    # (which set Cache-Control) re-state them. HSTS is deliberately absent here (plain HTTP
    # behind the TLS edge — see GEO-36). The CSP is tuned for a MapLibre + deck.gl SPA:
    #   worker-src/child-src blob:  → MapLibre spins up its web workers from blob: URLs
    #   style-src 'unsafe-inline'   → MapLibre/deck.gl set inline element styles
    #   img-src data: blob:         → sprites/markers/generated canvases
    #   cartocdn + arcgisonline     → DEFAULT token-less basemaps (CARTO light/dark raster,
    #     Esri streets/satellite); demotiles.maplibre.org → glyph .pbf (fetched via fetch →
    #     connect-src). MapLibre loads raster tiles + glyphs by fetch, so these origins MUST be
    #     in connect-src (img-src too, for safety) or the default map renders blank.
    #   *.mapbox.com (img+connect)  → Mapbox tiles/styles/glyphs WHEN MAPBOX_TOKEN is set
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; worker-src blob:; child-src blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://basemaps.cartocdn.com https://services.arcgisonline.com https://api.mapbox.com https://*.tiles.mapbox.com; font-src 'self' data:; connect-src 'self' https://basemaps.cartocdn.com https://services.arcgisonline.com https://demotiles.maplibre.org https://api.mapbox.com https://*.tiles.mapbox.com https://events.mapbox.com https://api.openai.com" always;

    # Container liveness (independent of whether the SPA/artifact exist yet) — for HEALTHCHECK.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 "ok\n";
    }

    # Hashed build assets are content-addressed → cache hard. index.html must NOT be cached so
    # a redeploy is picked up immediately. (Security headers re-stated: own add_header below.)
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; worker-src blob:; child-src blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://basemaps.cartocdn.com https://services.arcgisonline.com https://api.mapbox.com https://*.tiles.mapbox.com; font-src 'self' data:; connect-src 'self' https://basemaps.cartocdn.com https://services.arcgisonline.com https://demotiles.maplibre.org https://api.mapbox.com https://*.tiles.mapbox.com https://events.mapbox.com https://api.openai.com" always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; worker-src blob:; child-src blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://basemaps.cartocdn.com https://services.arcgisonline.com https://api.mapbox.com https://*.tiles.mapbox.com; font-src 'self' data:; connect-src 'self' https://basemaps.cartocdn.com https://services.arcgisonline.com https://demotiles.maplibre.org https://api.mapbox.com https://*.tiles.mapbox.com https://events.mapbox.com https://api.openai.com" always;
        try_files $uri =404;
    }

    # Parcels vector tiles: byte-range + permissive CORS + immutable cache. ONLY *.pmtiles is
    # exposed from /data — the regex location is matched before the /data/ deny below. Range
    # serving is on by default for static files; the headers make it explicit + CORS-friendly
    # in case tiles are ever fronted by a CDN / different origin.
    location ~* ^/data/.+\.pmtiles$ {
        root /;                        # /data/current/x.pmtiles → /data/current/x.pmtiles
        default_type application/octet-stream;
        add_header Accept-Ranges bytes always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges, ETag" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Everything else under /data/ is private (the DuckDB artifact, parquet, slope.tif, the
    # release manifest, …). Never serve it.
    location /data/ {
        return 404;
    }

    # API reverse proxy. Resolve the `api` service name via Docker's embedded DNS at REQUEST
    # time (a variable proxy_pass + resolver) rather than at config load — so `nginx -t` and
    # startup don't fail when `api` isn't resolvable yet, and a restarted api is picked up.
    # With a variable proxy_pass nginx does NOT auto-append the matched path, so pass the full
    # original URI explicitly. The FastAPI app serves routes UNDER /api (e.g. /api/health), so
    # $request_uri (unchanged) is exactly right — a trailing-slash proxy_pass would strip /api.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SSE streaming agent (GEO-21: Pydantic AI → Gemini). text/event-stream, long-lived. This
    # MUST sit before the generic /api/ block (it is also a longer prefix, so nginx prefers it
    # regardless of order). Buffering/cache/gzip OFF so tokens flush immediately; HTTP/1.1 with
    # an empty Connection header keeps the upstream keep-alive; long read/send timeouts cover a
    # full generation. STRICTER per-IP rate + a tight concurrent-stream cap protect the metered
    # LLM key. No add_header here → it inherits the server-level security headers above. The app
    # emits `X-Accel-Buffering: no`; we never proxy_hide_header it, and proxy_buffering off
    # already guarantees immediate flushing.
    location /api/agent {
        limit_req zone=agent_rl burst=3 nodelay;
        limit_conn agent_conns 2;
        client_max_body_size 256k;

        set $agent_upstream http://api:8000;
        proxy_pass $agent_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /api/ {
        limit_req zone=api_rl burst=20 nodelay;
        limit_conn api_conns 20;
        # Drawn polygons can be largish but are bounded; 1m is generous headroom over a complex
        # multi-ring AOI while still capping abusive bodies well under the API's own validation.
        client_max_body_size 1m;

        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SPA history fallback — client-side routes resolve to index.html. No add_header → inherits
    # the server-level security headers (so the bootstrapping document carries the CSP).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
