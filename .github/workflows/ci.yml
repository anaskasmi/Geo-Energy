# GEO-38 — CI. On every push/PR to main: run the API tests + the frontend typecheck/build,
# then prove all images build. No secrets are needed (the agent/secret keys are runtime-only;
# MAPBOX_TOKEN is a public build arg and is left empty here). Deploy is a SEPARATE, gated
# workflow (deploy.yml) — this one never touches a host or a registry.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-tests:
    name: API tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Install API deps (runtime + dev/test)
        run: pip install -r api/requirements-dev.txt
      - name: Run API test suite
        working-directory: api
        run: python -m pytest -q

  frontend-build:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (clean, from lockfile)
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck + build (tsc -b && vite build)
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Build images
    runs-on: ubuntu-latest
    # Only spend build minutes once the code is known-good.
    needs: [api-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build all service images (api, web, ingest, frontend)
        # `compose build` honours the profiles so all four images are built. No push here —
        # this job only PROVES the Dockerfiles build. MAPBOX_TOKEN stays empty (public arg).
        run: docker compose --profile ingest --profile build build
